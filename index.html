<!DOCTYPE html>
<html>
<head>
<title>For Jiya ❤️</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
  background: linear-gradient(135deg, black, #ff4d88);
  color: white;
  text-align: center;
}

.container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* Buttons */
button {
  padding: 12px 25px;
  margin: 10px;
  font-size: 18px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

#yes { background: #ff4d88; color: white; }
#no {
  background: #333;
  color: white;
  position: relative;
}

/* Page 2 cursive style */
.cursive {
  font-family: "Brush Script MT", cursive;
  font-size: 26px;
  font-weight: bold;
}

/* Hearts */
.heart {
  position: fixed;
  font-size: 20px;
  animation: floatUp 3s linear forwards;
}

@keyframes floatUp {
  from {transform: translateY(0); opacity:1;}
  to {transform: translateY(-300px); opacity:0;}
}

/* Fireworks */
.firework {
  position: fixed;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #ff4d88;
  animation: explode 1s ease-out forwards;
}

@keyframes explode {
  from {
    transform: scale(1);
    opacity: 1;
  }
  to {
    transform: scale(20);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container" id="app"></div>

<audio id="music" src="https://files.catbox.moe/9q8r9h.mp3"></audio>

<script>

/* PASSWORD PAGE */
let password = "jiya";

document.getElementById("app").innerHTML = `
<h2>Enter Password</h2>
<input id="pass" type="password" style="padding:10px;font-size:16px;">
<br><br>
<button onclick="checkPass()">Enter</button>
<p id="wrong"></p>
`;

function checkPass(){
  if(document.getElementById("pass").value === password){
    page1();
  } else {
    document.getElementById("wrong").innerText = "Wrong password";
  }
}

/* PAGE 1 */
function page1(){
  app.innerHTML = `
  <h2>Someone has something special for you...</h2>
  <button onclick="page2()">Open</button>
  `;
}

/* PAGE 2 – Cursive Bold */
function page2(){
  app.innerHTML = `
  <div class="cursive">
  <h1>A Letter For Jiya ❤️</h1>
  </div>
  <button onclick="page3()">Continue</button>
  `;
}

/* PAGE 3 – Typing Letter */
function page3(){
  app.innerHTML = `<div id="text"></div><br><button onclick="page4()">Next</button>`;

  let msg = "Dear Jiya,\\n\\nFrom the day you came into my life, everything feels different.\\nYour smile, your talks, everything is special to me.\\nYou make my normal days feel beautiful.\\n\\nI just want you to know that you are really important to me.";
  
  typeText(msg);
}

function typeText(text){
  let i = 0;
  function typing(){
    if(i < text.length){
      document.getElementById("text").innerHTML +=
      text.charAt(i) == "\\n" ? "<br>" : text.charAt(i);
      i++;
      setTimeout(typing, 35);
    }
  }
  typing();
}

/* PAGE 4 */
function page4(){
  app.innerHTML = `
  <h2>There is something I want to ask you...</h2>
  <button onclick="page5()">Continue</button>
  `;
}

/* PAGE 5 – Valentine */
function page5(){
  app.innerHTML = `
  <h2>Will you be my Valentine? ❤️</h2>
  <button id="yes" onclick="page6()">Yes</button>
  <button id="no" onmouseover="moveNo()">No</button>
  `;
}

function moveNo(){
  let btn = document.getElementById("no");
  btn.style.position = "absolute";
  btn.style.left = Math.random()*80 + "%";
  btn.style.top = Math.random()*80 + "%";
}

/* PAGE 6 – Final with Fireworks */
function page6(){
  document.getElementById("music").play();

  app.innerHTML = `
  <h1>You just made my day the happiest ❤️</h1>
  `;

  setInterval(createHeart, 200);
  setInterval(createFirework, 500);
}

function createHeart(){
  let heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random()*100 + "vw";
  heart.style.bottom = "0";
  document.body.appendChild(heart);

  setTimeout(()=>heart.remove(),3000);
}

/* Firework function */
function createFirework(){
  let fire = document.createElement("div");
  fire.className = "firework";
  fire.style.left = Math.random()*100 + "vw";
  fire.style.top = Math.random()*100 + "vh";
  document.body.appendChild(fire);

  setTimeout(()=>fire.remove(),1000);
}

</script>

</body>
</html>
